name: GroundTruth frozen retrieval regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: .github/workflows/retrieval-regression.yml
      - name: Verify corpus inputs were checked out
        run: |
          test -f manifest/kubernetes_v0.1.yaml || { echo 'Missing manifest/kubernetes_v0.1.yaml'; exit 1; }
          test -f data/processed/sections.jsonl || { echo 'Missing data/processed/sections.jsonl. Commit it or add an artifact restoration step.'; exit 1; }
          test -f data/evaluation/golden_questions.jsonl || { echo 'Missing frozen golden questions'; exit 1; }
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install GroundTruth evaluation dependencies
        run: python -m pip install numpy sentence-transformers tiktoken PyYAML
      - name: Rebuild corpus and indexes, run fresh test evaluation, enforce quality gate
        run: python -m groundtruth.ci.run_frozen_regression --device cpu
      - name: Save debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groundtruth-frozen-regression
          path: |
            data/ci/frozen_retrieval/*report.json
            data/ci/frozen_retrieval/hybrid_rrf_v0_2_test.json
          if-no-files-found: warn
          retention-days: 14
